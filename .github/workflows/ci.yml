name: Build and publish
on:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  smoke:
    uses: ./.github/workflows/image-smoke.yml

  publish:
    needs: [tests, smoke]
    uses: ./.github/workflows/docker-publish.yml
