name: Image smoke test
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve calibre-web develop SHA
        id: calibreweb
        run: |
          sha=$(git ls-remote https://github.com/nigeldixon/calibre-web.git refs/heads/develop | cut -f1)
          if [ -z "$sha" ]; then
            echo "Failed to resolve calibre-web develop SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building calibre-web develop@$sha"

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: calibre-web:test-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            CALIBREWEB_SHA=${{ steps.calibreweb.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Image contents
        run: tests/image_contents.sh calibre-web:test-${{ matrix.arch }} ${{ matrix.arch }}

      - name: Entrypoint behaviour
        run: tests/image_entrypoint.sh calibre-web:test-${{ matrix.arch }}

      - name: kcc-c2e conversion
        run: tests/image_smoke.sh calibre-web:test-${{ matrix.arch }}

      - name: Colour preserved
        run: tests/image_color.sh calibre-web:test-${{ matrix.arch }}

      - name: Watcher end-to-end
        run: tests/image_watcher.sh calibre-web:test-${{ matrix.arch }}

      - name: calibre-web health
        run: tests/image_health.sh calibre-web:test-${{ matrix.arch }}
