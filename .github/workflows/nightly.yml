name: Check dependency versions
on:
  schedule:
    - cron:  '0 23 * * *'  
  workflow_dispatch:
jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs: 
      needsdeploy: ${{ steps.changes.outputs.modified }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch dependency versions
        run: |
          # Take the version from the calibre-<version>-x86_64.txz filename
          # rather than a URL path segment: the dist endpoint normally
          # redirects to download.calibre-ebook.com/<version>/ but can
          # transiently redirect to GitHub, where the path segment is the
          # org name (kovidgoyal) instead of the version.
          calibre_url="$(curl -sI https://calibre-ebook.com/dist/linux-x86_64 | awk 'tolower($1)=="location:"{print $2}' | tr -d '\r')"
          calibre_version="$(basename "$calibre_url" | sed -n 's/^calibre-\(.*\)-x86_64\.txz$/\1/p')"
          if [ -z "$calibre_version" ]; then
            calibre_version="$(printf '%s\n' "$calibre_url" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          fi
          if [ -z "$calibre_version" ]; then
            echo "could not determine the calibre version from: $calibre_url" >&2
            exit 1
          fi
          {
            echo "calibre-web: $(git ls-remote https://github.com/nigeldixon/calibre-web.git refs/heads/develop | cut -f1)"
            echo "kcc: $(git ls-remote https://github.com/nigeldixon/kcc.git HEAD | cut -f1)"
            echo "calibre: $calibre_version"
            echo "kepubify: $(curl -sI https://github.com/pgaskin/kepubify/releases/latest | awk 'tolower($1)=="location:"{print $2}' | tr -d '\r' | awk -F/ '{print $NF}')"
          } > dependencies.txt
          cat dependencies.txt
      - name: Process changes
        id: changes
        run: |
          git config --global user.name 'Release Bot'
          git config --global user.email 'releasebot@iamdixon.net'
          git add dependencies.txt
          git commit -m "Update dependency versions" && modified=1 || modified=0 
          echo "modified=$modified" >> $GITHUB_OUTPUT
          echo "$GITHUB_OUTPUT"
          git push
      - name: Show if changes
        run: echo "Has changes ${{ steps.changes.outputs.modified }}"
  deploy:
    needs: get-version
    if: needs.get-version.outputs.needsdeploy == 1
    # Call the gated entry point so the dependency build runs tests and the
    # image smoke test before publishing.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/ci.yml
